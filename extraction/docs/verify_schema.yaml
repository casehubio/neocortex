format_version: 1

# Entity name aliases — used for dangling edge and subject resolution.
# These are corpus-specific; update per biography.
entity_aliases:
  "Frida": "Frida Kahlo"
  "Diego": "Diego Rivera"
  "Leon Trotsky": "León Trotsky"
  "The Two Fridas": "Las dos Fridas"
  "Self-Portrait with Cropped Hair": "Autorretrato con pelo cortado"

# Per-type field contracts — node-based entity types only.
# life_event and current_state are memory-based (not in nodes array)
# and validated under the memories section below.
entity_types:
  goal:
    subgraph_type: GOAL
    field_mappings:
      goal_tier: tier
      goal_horizon: horizon
      goal_status: status
      goal_urgency: urgency
      goal_need_tier: need_tier
      goal_priority: priority
      goal_feasibility: feasibility
    required_fields:
      - name
      - tier
    vocabularies:
      content_domain:
        values:
          - morality-and-virtue
          - religion-and-spirituality
          - self-actualisation
          - avoidance
          - social-relating
          - health
          - family
          - mastery-and-competence
          - financial-and-occupational
        source: GoalVocabulary.CONTENT_DOMAINS
      content_subdomain:
        values:
          - social-values
          - personal-morals
          - help-others
          - highly-regarded
          - religion-and-spirituality
          - wisdom-and-serenity
          - self-knowledge-and-happiness
          - appreciating-beauty
          - exploration-and-passions
          - enjoy-life
          - avoid-stress-harm-rejection-conflict
          - avoid-hassles
          - relate-and-belong
          - intimacy
          - stability
          - power
          - leadership
          - health
          - family
          - achievement
          - self-efficacy
          - practical-competence
          - intellectual-competence
          - finances
          - occupational-success
        source: GoalVocabulary.CONTENT_SUBDOMAINS
      motivation_origin:
        values:
          - intrinsic
          - identified
          - introjected
          - external
        source: GoalVocabulary.MOTIVATION_ORIGINS
    ranges:
      pad.pleasure: [-1.0, 1.0]
      pad.arousal: [-1.0, 1.0]
      pad.dominance: [-1.0, 1.0]
      clarity: [0.0, 1.0]
    volume:
      warn_above: 60

  place:
    subgraph_type: PLACE
    required_fields:
      - name
    ranges:
      pad.pleasure: [-1.0, 1.0]
      pad.arousal: [-1.0, 1.0]
      pad.dominance: [-1.0, 1.0]

  person:
    subgraph_type: PERSON
    required_fields:
      - name
    ranges:
      pad.pleasure: [-1.0, 1.0]
      pad.arousal: [-1.0, 1.0]
      pad.dominance: [-1.0, 1.0]

  belief:
    subgraph_type: COGNITIVE
    required_fields:
      - description
    ranges:
      confidence: [0.0, 1.0]

  activity:
    subgraph_type: ACTIVITY
    required_fields:
      - name

  project:
    subgraph_type: PROJECT
    required_fields:
      - name

  organisation:
    subgraph_type: ORGANISATION
    required_fields:
      - name
    ranges:
      pad.pleasure: [-1.0, 1.0]
      pad.arousal: [-1.0, 1.0]
      pad.dominance: [-1.0, 1.0]

  cultural_context:
    subgraph_type: CULTURAL
    required_fields:
      - description

# Converter-produced types — not in the nodes array.
# These are generated by convert_corpus.py from top-level corpus sections.
converter_types:
  entity_enrichment:
    required_fields:
      - entity_ref
    ranges:
      drive_baseline_value: [0.0, 1.0]
      caps_frequency: [0.0, 1.0]

  disposition_profile:
    required_fields:
      - entity_ref
    vocabularies:
      social_orient:
        values: [independent, cooperative, competitive]
      rule_following:
        values: [defiant, flexible, conformist]
      risk_appetite:
        values: [conservative, calculated, bold]
      autonomy:
        values: [dependent, collaborative, autonomous]
      conflict_mode:
        values: [avoidant, diplomatic, confrontational]

# Converter configuration — controls convert_corpus.py behaviour.
converter:
  subject_name: "Frida Kahlo"
  output_dir: "biography-output"
  skip_formative_experiences: false
  concept_mapping: belief
  edge_attribution: source_priority

edges:
  valid_types:
    - pursues
    - associated-with
    - at
    - contributes-to
    - created-by
    - located-in
    - enables
    - blocks
    - requires
    - decomposes-into
    - collaborated-with
    - participated
    - lives-at
    - evidence-for
    - inspires
    - opposes
    - influences
    - teaches
    - mentors
  dangling:
    critical_pct: 10
    warn_pct: 2

memories:
  valid_domains:
    - experience
    - relationship
    - reflection
    - mood
  enrichment_fields:
    - pad
    - occ_emotions
    - sec_appraisal
    - action_tendencies
    - sub_thoughts
    - cognitive_distortions
    - drive_impact
    - confidence
  enrichment_threshold: 80
  sub_thought_types:
    - affect-observation
    - causal-inference
    - evaluative
    - intention
    - self-reflection
    - association
    - concern
  ranges:
    pad.pleasure: [-1.0, 1.0]
    pad.arousal: [-1.0, 1.0]
    pad.dominance: [-1.0, 1.0]
