<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="740" height="480" fill="#fafaf9" rx="8"/>

  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Web Capture Pipeline — Library Reuse Architecture</text>

  <!-- Agent -->
  <rect x="20" y="55" width="120" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="82" text-anchor="middle" font-weight="500" fill="#3730a3">Agent</text>

  <!-- Arrow -->
  <line x1="140" y1="78" x2="188" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="164" y="72" text-anchor="middle" font-size="10" fill="#64748b">webCapture(url)</text>

  <!-- MCP Tool -->
  <rect x="192" y="55" width="130" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="257" y="75" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">MCP Tool</text>
  <text x="257" y="90" text-anchor="middle" font-size="10" fill="#b45309">corpus-management</text>

  <!-- Arrow to diamond -->
  <line x1="322" y1="78" x2="368" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cache check diamond -->
  <polygon points="420,53 475,78 420,103 365,78" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">URL in</text>
  <text x="420" y="87" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">cache?</text>

  <!-- HIT path right -->
  <line x1="475" y1="78" x2="530" y2="78" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="502" y="72" font-size="10" fill="#16a34a" font-weight="500">HIT</text>
  <rect x="534" y="55" width="170" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="619" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">Return cached content</text>
  <text x="619" y="90" text-anchor="middle" font-size="10" fill="#15803d">zero network, zero parse</text>

  <!-- MISS path down -->
  <line x1="420" y1="103" x2="420" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="434" y="124" font-size="10" fill="#dc2626" font-weight="500">MISS</text>

  <!-- Fetch -->
  <rect x="345" y="142" width="150" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="162" text-anchor="middle" font-size="11" fill="#334155">Fetch HTML</text>
  <text x="420" y="175" text-anchor="middle" font-size="10" fill="#64748b">HttpClient or pre-rendered</text>

  <!-- Arrow down to parse pipeline -->
  <line x1="420" y1="184" x2="420" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parse pipeline container -->
  <rect x="50" y="214" width="640" height="105" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Parse Pipeline — three libraries, one thin integration layer</text>

  <!-- Readability4J -->
  <rect x="70" y="250" width="160" height="50" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="270" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Readability4J</text>
  <text x="150" y="286" text-anchor="middle" font-size="10" fill="#7c3aed">article extraction from noise</text>

  <!-- Arrow -->
  <line x1="230" y1="275" x2="268" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Flexmark -->
  <rect x="272" y="250" width="140" height="50" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="342" y="270" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Flexmark</text>
  <text x="342" y="286" text-anchor="middle" font-size="10" fill="#7c3aed">HTML → markdown</text>

  <!-- Arrow -->
  <line x1="412" y1="275" x2="450" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Setext→ATX -->
  <rect x="454" y="250" width="100" height="50" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="504" y="270" text-anchor="middle" font-size="11" font-weight="500" fill="#854d0e">ATX fix</text>
  <text x="504" y="286" text-anchor="middle" font-size="10" fill="#a16207">5 lines</text>

  <!-- Arrow -->
  <line x1="554" y1="275" x2="582" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Annotations -->
  <rect x="586" y="250" width="90" height="50" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="631" y="270" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">#@ tags</text>
  <text x="631" y="286" text-anchor="middle" font-size="10" fill="#22c55e">page/table/fig</text>

  <!-- Arrow down from pipeline -->
  <line x1="420" y1="319" x2="420" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- WebCaptureService -->
  <rect x="240" y="352" width="360" height="50" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="420" y="372" text-anchor="middle" font-size="12" font-weight="500" fill="#9a3412">WebCaptureService</text>
  <text x="420" y="389" text-anchor="middle" font-size="10" fill="#c2410c">URL dedup within TTL · stale re-fetch creates versioned entry · updates relationship</text>

  <!-- Arrow down to store -->
  <line x1="420" y1="402" x2="420" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Corpus Store -->
  <rect x="300" y="432" width="240" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="420" y="450" text-anchor="middle" font-size="12" font-weight="500" fill="#075985">CorpusEntryStore</text>
  <text x="420" y="463" text-anchor="middle" font-size="10" fill="#0369a1">SQLite + json_extract + RAG index</text>

  <!-- SPI callout -->
  <rect x="20" y="352" width="200" height="55" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="120" y="370" text-anchor="middle" font-size="11" font-weight="500" fill="#854d0e">HtmlToMarkdownParser SPI</text>
  <text x="120" y="385" text-anchor="middle" font-size="10" fill="#a16207">corpus-management-api module</text>
  <text x="120" y="398" text-anchor="middle" font-size="10" fill="#a16207">→ no Tika/PDFBox on classpath</text>

  <!-- Dashed line from SPI to WebCaptureService -->
  <line x1="220" y1="377" x2="240" y2="377" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
