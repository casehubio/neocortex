<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Provenance Chain — Who Wrote What, and Why</text>

  <!-- Agent writes -->
  <rect x="20" y="55" width="110" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="75" y="78" text-anchor="middle" font-size="11" font-weight="500" fill="#312e81">Agent writes</text>
  <text x="75" y="93" text-anchor="middle" font-size="10" fill="#4338ca">a finding</text>

  <!-- Corpus entry -->
  <rect x="180" y="55" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="245" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">Corpus entry</text>
  <text x="245" y="89" text-anchor="middle" font-size="10" fill="#475569">body + metadata</text>
  <text x="245" y="103" text-anchor="middle" font-size="10" fill="#475569">+ audit fields</text>

  <!-- Audit info -->
  <rect x="360" y="45" width="140" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="66" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">Audit trail</text>
  <text x="430" y="82" text-anchor="middle" font-size="10" fill="#b45309">createdBy: agent-3</text>
  <text x="430" y="96" text-anchor="middle" font-size="10" fill="#b45309">createdAt: 2026-11-08</text>
  <text x="430" y="110" text-anchor="middle" font-size="10" fill="#b45309">updatedBy: agent-7</text>

  <!-- Future reader -->
  <rect x="550" y="55" width="110" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="605" y="78" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">Future agent</text>
  <text x="605" y="93" text-anchor="middle" font-size="10" fill="#15803d">evaluates trust</text>

  <!-- Arrows -->
  <line x1="130" y1="85" x2="175" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="85" x2="355" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="85" x2="545" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bottom context -->
  <text x="245" y="150" text-anchor="middle" font-size="10" fill="#64748b">provenance record</text>
  <text x="245" y="164" text-anchor="middle" font-size="10" fill="#64748b">links to source issue</text>
  <line x1="245" y1="115" x2="245" y2="142" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="430" y="150" text-anchor="middle" font-size="10" fill="#64748b">metadata schema</text>
  <text x="430" y="164" text-anchor="middle" font-size="10" fill="#64748b">validates field types</text>
  <line x1="430" y1="125" x2="430" y2="142" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
