<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafaf9" rx="8"/>

  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Image Capture — Mechanical Extraction + LLM Description</text>

  <!-- Raw HTML input -->
  <rect x="20" y="55" width="110" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="75" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Raw HTML</text>
  <text x="75" y="90" text-anchor="middle" font-size="10" fill="#64748b">from webCapture</text>

  <!-- Arrow to Jsoup -->
  <line x1="130" y1="78" x2="168" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Jsoup extraction -->
  <rect x="172" y="55" width="130" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="237" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Jsoup</text>
  <text x="237" y="90" text-anchor="middle" font-size="10" fill="#7c3aed">extract &lt;img&gt; + resolve URLs</text>

  <!-- Arrow to fetch -->
  <line x1="302" y1="78" x2="340" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HttpClient fetch -->
  <rect x="344" y="55" width="130" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="409" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">HttpClient</text>
  <text x="409" y="90" text-anchor="middle" font-size="10" fill="#b45309">fetch image bytes</text>

  <!-- Arrow to describe -->
  <line x1="474" y1="78" x2="512" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ImageDescriber -->
  <rect x="516" y="55" width="130" height="46" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="581" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#9d174d">ImageDescriber</text>
  <text x="581" y="90" text-anchor="middle" font-size="10" fill="#be185d">LLM vision (optional)</text>

  <!-- Two output arrows from ImageDescriber -->
  <!-- Down to enrichment -->
  <line x1="581" y1="101" x2="581" y2="145" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Markdown enrichment -->
  <rect x="430" y="149" width="300" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">Enrich positional markdown</text>
  <text x="580" y="185" text-anchor="middle" font-size="10" fill="#2563eb">#@ figure: caption="..." describe="LLM description..."</text>

  <!-- Down to store -->
  <line x1="409" y1="101" x2="409" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Store container -->
  <rect x="30" y="234" width="680" height="90" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Corpus Store — each image is a separate entry</text>

  <!-- Page entry -->
  <rect x="50" y="268" width="200" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="150" y="285" text-anchor="middle" font-size="11" font-weight="500" fill="#075985">Page Entry</text>
  <text x="150" y="299" text-anchor="middle" font-size="10" fill="#0369a1">domain: web-cache</text>

  <!-- Relationship arrow -->
  <line x1="250" y1="288" x2="308" y2="288" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="279" y="282" text-anchor="middle" font-size="9" fill="#ea580c">derived-from</text>

  <!-- Image entry 1 -->
  <rect x="312" y="268" width="180" height="40" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="402" y="285" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">Image Entry 1</text>
  <text x="402" y="299" text-anchor="middle" font-size="10" fill="#b45309">domain: web-cache-image</text>

  <!-- Image entry 2 -->
  <rect x="510" y="268" width="180" height="40" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="285" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">Image Entry 2</text>
  <text x="600" y="299" text-anchor="middle" font-size="10" fill="#b45309">domain: web-cache-image</text>

  <!-- Graceful degradation callout -->
  <rect x="20" y="149" width="380" height="50" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="210" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#854d0e">Graceful degradation at every step</text>
  <text x="210" y="185" text-anchor="middle" font-size="10" fill="#a16207">fetch fails → skip image | no describer → store without description | all fail → text capture unchanged</text>
</svg>
