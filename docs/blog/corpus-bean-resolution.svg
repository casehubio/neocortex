<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Bean Resolution — Three-Tier Fallback</text>

  <!-- SPI Layer -->
  <rect x="40" y="60" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">corpus-management-api</text>
  <text x="140" y="105" text-anchor="middle" font-size="10" fill="#64748b">CorpusCatalogue</text>
  <text x="140" y="120" text-anchor="middle" font-size="10" fill="#64748b">CorpusEntryStore</text>
  <text x="140" y="135" text-anchor="middle" font-size="10" fill="#64748b">FederatedCorpusSearch</text>
  <text x="140" y="150" text-anchor="middle" font-size="10" fill="#64748b">CorpusSearch</text>

  <!-- NoOp Layer -->
  <rect x="260" y="60" width="200" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">NoOp Fallbacks</text>
  <text x="360" y="105" text-anchor="middle" font-size="10" fill="#78716c">@DefaultBean (Quarkus)</text>
  <text x="360" y="120" text-anchor="middle" font-size="10" fill="#78716c">@ConditionalOnMissingBean</text>
  <text x="360" y="135" text-anchor="middle" font-size="10" fill="#78716c">(Spring)</text>
  <text x="360" y="153" text-anchor="middle" font-size="9" font-style="italic" fill="#a8a29e">return List.of() / Optional.empty()</text>

  <!-- Real Impl Layer -->
  <rect x="480" y="60" width="200" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">SQLite Implementations</text>
  <text x="580" y="105" text-anchor="middle" font-size="10" fill="#3f6212">SqliteCorpusCatalogue</text>
  <text x="580" y="120" text-anchor="middle" font-size="10" fill="#3f6212">SqliteCorpusEntryStore</text>
  <text x="580" y="135" text-anchor="middle" font-size="10" fill="#3f6212">ChainWalkerFederatedSearch</text>
  <text x="580" y="153" text-anchor="middle" font-size="9" font-style="italic" fill="#65a30d">activated by config property</text>

  <!-- Arrows: SPI → NoOp -->
  <line x1="240" y1="110" x2="258" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="249" y="103" text-anchor="middle" font-size="8" fill="#94a3b8">implements</text>

  <!-- Arrows: SPI → Real -->
  <path d="M 240 130 Q 370 200 478 130" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead-green)"/>
  <text x="360" y="188" text-anchor="middle" font-size="8" fill="#16a34a">implements (displaces NoOp)</text>

  <!-- Decision flow -->
  <rect x="140" y="220" width="440" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Resolution at Startup</text>

  <!-- Decision diamond -->
  <polygon points="360,264 420,294 360,324 300,294" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="298" text-anchor="middle" font-size="9" fill="#1e40af">sqlite.enabled</text>
  <text x="360" y="308" text-anchor="middle" font-size="9" fill="#1e40af">= true ?</text>

  <!-- Yes path -->
  <line x1="420" y1="294" x2="520" y2="294" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="468" y="288" font-size="9" fill="#16a34a" font-weight="600">YES</text>
  <rect x="522" y="274" width="180" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="612" y="291" text-anchor="middle" font-size="9" fill="#166534">SQLite beans created</text>
  <text x="612" y="304" text-anchor="middle" font-size="9" fill="#166534">NoOps displaced</text>

  <!-- No path -->
  <line x1="300" y1="294" x2="200" y2="294" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="252" y="288" font-size="9" fill="#f59e0b" font-weight="600">NO</text>
  <rect x="18" y="274" width="180" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="108" y="291" text-anchor="middle" font-size="9" fill="#92400e">NoOp beans active</text>
  <text x="108" y="304" text-anchor="middle" font-size="9" fill="#92400e">safe empty defaults</text>

  <!-- Bottom labels -->
  <text x="108" y="350" text-anchor="middle" font-size="9" fill="#94a3b8">Module on classpath,</text>
  <text x="108" y="362" text-anchor="middle" font-size="9" fill="#94a3b8">backend not configured</text>
  <text x="612" y="350" text-anchor="middle" font-size="9" fill="#94a3b8">Full corpus management</text>
  <text x="612" y="362" text-anchor="middle" font-size="9" fill="#94a3b8">with persistent storage</text>
</svg>
