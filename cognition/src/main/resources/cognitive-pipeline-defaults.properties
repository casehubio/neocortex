# Cognitive Pipeline Configuration — Literature-Grounded Defaults
#
# Every property has a default grounded in published research.
# Override per deployment via application.properties or environment variables.
# Per-agent overrides available via CognitiveDefaults YAML profiles.

# ─── Behavioral Synthesis (consolidation) ───────────────────────────
#
# How CAPS attractor strength evolves during consolidation.

# EMA retention: weight on prior strength vs new settler output.
# Literature: Rescorla-Wagner α=0.3-0.4 for single associative trials
#   (Rescorla & Wagner, 1972, Psychological Review). Consolidation batches
#   multiple experiences, justifying higher α for faster convergence.
# Range: [0.0, 1.0]. Higher = more inertia, slower change.
casehub.mindmap.consolidation.behavioral.ema-retention=0.5

# Reinforcement boost cap: maximum multiplicative boost from repeated
# reinforcement. After many observations of the same pattern, strength
# can exceed the raw settler output by up to this factor.
# Literature: Power law of practice — logarithmic diminishing returns
#   (Newell & Rosenbloom, 1981, Cognitive Skills and Their Acquisition).
# Range: [0.0, 1.0]. 0.5 = up to 50% boost above settler output.
casehub.mindmap.consolidation.behavioral.reinforcement-boost-cap=0.5

# Reinforcement scale: denominator for log-scaled reinforcement bonus.
# log1p(sourceCount) / log1p(reinforcementScale).
# Higher values mean more reinforcements needed to reach the cap.
# Literature: Progressive chunking mechanism from power law of practice.
# Range: [1, ∞). 20 = ~20 reinforcements to approach the cap.
casehub.mindmap.consolidation.behavioral.reinforcement-scale=20

# Maximum graduated nodes processed per consolidation pass.
casehub.mindmap.consolidation.behavioral.max-per-pass=20

# ─── Experience Graduation ──────────────────────────────────────────
#
# When experience memories are promoted to cognitive subgraph nodes.

# Graduation score threshold: minimum GraduationScorer output to promote.
# Range: [0.0, 1.0].
casehub.mindmap.consolidation.graduation.threshold=0.5

# Minimum corroborating observations before graduation.
# Lower = faster pattern recognition from fewer examples.
# Range: [1, ∞). Default lowered from 3 to 2 per #511.
casehub.mindmap.consolidation.graduation.min-corroboration=2

# ─── Appraisal Thresholds ──────────────────────────────────────────
#
# Drive activation and concern salience thresholds.
# Currently set via AppraisalThresholds record (not SmallRye).

# Drive activation threshold: minimum intensity for a drive to be
# foregrounded in prompt rendering.
# Literature: CAPS model activation threshold — connectionist nodes fire
#   at midpoint (Mischel & Shoda, 1995, Psychological Review, 102, 246-268).
# Range: [0.0, 1.0].
# casehub.cognition.appraisal.drive-activation-threshold=0.5

# Concern salience threshold: minimum keyword-overlap score for a
# concern to trigger drive foregrounding.
# Literature: Klinger Current Concerns Theory — active concerns create
#   broad attentional bias toward all relevant stimuli, not just highly
#   relevant ones (Klinger, 1971, Structure and Functions of Fantasy;
#   Klinger & Cox, 2004, Handbook of Motivational Counseling).
# Range: [0.0, 1.0]. Low threshold = more responsive.
# casehub.cognition.appraisal.concern-salience-threshold=0.1

# ─── Trust Formation ───────────────────────────────────────────────
#
# How personality modulates trust/familiarity computation.
# Currently derived from SocialCognitionDefaults per agent.

# Trust formation rate: how quickly positive interactions build trust.
# Literature: Social Value Orientation research — prosocial/cooperative
#   orientations positively correlate with trust formation
#   (Van Lange et al., 1997, JPSP; Balliet et al., 2009, Psychological Bulletin).
# Derived from disposition: cooperative=0.7, competitive=0.4, independent=0.3.
# Range: [0.0, 1.0].
# (Per-agent via CognitiveDerivationEngine.deriveSocialCognition)

# Conflict interpretation: modulates negative interaction weight.
# Literature: Conflict resolution styles theory — repair-oriented individuals
#   discount negative signals, disengagement-oriented amplify them
#   (Thomas & Kilmann, 1974; Rusbult et al., 1991, JPSP).
# Values: REPAIR (0.6x), INFORMATION (0.9x), NEUTRAL (1.0x), DISENGAGE (1.4x).
# (Per-agent via CognitiveDerivationEngine.deriveSocialCognition)

# ─── Disposition Resting Activations ────────────────────────────────
#
# Baseline CAPS node activation levels from personality disposition.
# Literature: Reinforcement Sensitivity Theory (Gray, 1982; Gray & McNaughton,
#   2000) — BIS/BAS/FFFS baseline sensitivity varies as stable trait.
#   Neural correlates confirmed via frontal EEG asymmetry
#   (Firth et al., 2024, Psychophysiology).
#
# Mapping (set in DispositionWeightMapper):
#   cooperative  → other_reliability +0.2
#   competitive  → social_comparison +0.15
#   bold         → BAS_activation +0.1
#   conservative → BIS_activation +0.1
#   strict       → reinforcement_expectation +0.15
#   flexible     → self_efficacy +0.1
#   independent  → self_efficacy +0.15
#   dependent    → other_reliability +0.1
#   confrontational → threat_sensitivity +0.1
#   avoidant     → escape_assessment +0.15

# ─── CAPS Weight Update ────────────────────────────────────────────
#
# Rescorla-Wagner associative learning with Pearce-Hall precision.

# Precision growth after confirmed prediction (Pearce-Hall attention decay).
# @see Pearce & Hall (1980), Eq. 3.
# casehub.caps.weight-update.precision-growth-rate=0.1

# Precision decay factor on prediction error (attention recovery).
# casehub.caps.weight-update.precision-decay-factor=0.9

# Prediction error below which outcome counts as confirmed.
# casehub.caps.weight-update.confirm-epsilon=0.05

# Inhibitory weight decay rate per update cycle.
# @see Bouton (2004), Learning & Memory — extinction rates.
# casehub.caps.weight-update.base-decay-rate=0.05

# Floor for precision values (bounds Pearce-Hall alpha).
# casehub.caps.weight-update.min-precision=0.1

# Salience-to-alpha scaling factor for base learning rate.
# casehub.caps.weight-update.salience-alpha-scaling=0.1

# Dampening factor for decay resistance on effective weight.
# casehub.caps.weight-update.resistance-dampening=0.5

# Provenance precision: empirical > consensus > estimated.
# @see Kruschke (2015), Bayesian credible intervals.
# casehub.caps.weight-update.empirical-provenance-precision=10.0
# casehub.caps.weight-update.consensus-provenance-precision=5.0
# casehub.caps.weight-update.estimated-provenance-precision=1.0

# ─── CAPS Settling ─────────────────────────────────────────────────
#
# Attractor extraction and distortion thresholds.

# Min effective distortion threshold after modulation.
# casehub.caps.settling.min-effective-distortion-threshold=0.05

# Min attractor strength for inclusion in results.
# casehub.caps.settling.attractor-strength-min-filter=0.1

# Activation magnitude for saturation detection.
# casehub.caps.settling.saturation-activation-threshold=0.99

# ─── Goal Lifecycle ────────────────────────────────────────────────
#
# Goal prioritization weights and decay thresholds.
# @see Locke & Latham (2002), American Psychologist.
# @see Wrosch et al. (2003), PSPB — adaptive disengagement.

# Priority composite weights (should sum to 1.0).
casehub.cognition.goals.urgency-weight=0.3
casehub.cognition.goals.feasibility-weight=0.2
casehub.cognition.goals.affective-weight=0.2
casehub.cognition.goals.importance-weight=0.3

# Confidence thresholds for goal decay transitions.
casehub.cognition.goals.dormant-confidence-threshold=0.4
casehub.cognition.goals.abandon-confidence-threshold=0.2

# Attention signal thresholds.
casehub.cognition.goals.urgency-spike-threshold=0.7
casehub.cognition.goals.priority-shift-threshold=0.2

# Legacy PAD affect delta threshold.
casehub.cognition.goals.legacy-affect-delta-threshold=0.3

# ─── Prompt Rendering ──────────────────────────────────────────────
#
# Thresholds for behavioral/appraisal/mood prompt sections.
# @see Russell (1980), circumplex model.
# @see Mehrabian (1996), PAD temperament model.

# Behavioral attractor rendering.
casehub.cognition.prompt.behavioral-min-strength=0.1
casehub.cognition.prompt.behavioral-deep-rooted-threshold=0.7
casehub.cognition.prompt.behavioral-noticeable-threshold=0.4
casehub.cognition.prompt.behavioral-trend-delta=0.05

# Appraisal emotion rendering.
casehub.cognition.prompt.action-tendency-min-intensity=0.3
casehub.cognition.prompt.emotion-strong-threshold=0.7
casehub.cognition.prompt.emotion-moderate-threshold=0.4

# Mood PAD threshold.
casehub.cognition.prompt.mood-pad-threshold=0.3

# ─── Merge Detection ───────────────────────────────────────────────
#
# Mind map node deduplication via Jaro-Winkler + Jaccard.
# @see Jaro (1989), JASA; Winkler (1990), ASA.

casehub.mindmap.consolidation.merge.name-threshold=0.85
casehub.mindmap.consolidation.merge.neighbor-threshold=0.3
casehub.mindmap.consolidation.merge.auto-merge-threshold=0.9
casehub.mindmap.consolidation.merge.review-threshold=0.7
casehub.mindmap.consolidation.merge.name-weight=0.6
casehub.mindmap.consolidation.merge.neighbor-weight=0.4
casehub.mindmap.consolidation.merge.max-per-pass=10
